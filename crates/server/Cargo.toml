[package]
name = "cpdv-server"
description = "CPDV Bible API (/api/v1) on Axum - drop-in replacement for the Node service"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "cpdv-server"
path = "src/main.rs"

[dependencies]
cpdv-bible = { path = "../bible" }
axum = { version = "0.8", default-features = false, features = ["http1", "http2", "tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync"] }
tower-http = { version = "0.6", features = ["trace", "catch-panic"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
serde.workspace = true
serde_json.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock"] }
sha1 = "0.10"
base64 = "0.22"
rand = "0.9"
dotenvy = "0.15"
